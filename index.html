<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilstöld</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, Consolas, monospace; color: #eee; }
      #game { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000; }
      #ui { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
      #ui > * { pointer-events: auto; }
      .panel { background: rgba(12, 14, 18, 0.92); border: 2px solid #f1c40f; padding: 18px 22px; min-width: 320px; max-width: min(520px, 92vw);
        color: #eee; box-shadow: 0 10px 40px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 10px; margin-top: 25vh; }
      [hidden] { display: none !important; }
      .panel .difficulty span { flex: 1; }
      .panel button.choice { padding: 6px 10px; }
      .panel button.choice.active { background: #f1c40f; color: #111; border-color: #f1c40f; }
      .panel h2 { margin: 0 0 4px; color: #f1c40f; font-size: 18px; letter-spacing: 1px; }
      .panel button { font: inherit; background: #23262d; color: #eee; border: 1px solid #555; padding: 8px 12px; cursor: pointer; text-align: left; }
      .panel button:hover, .panel button:focus-visible { border-color: #f1c40f; outline: none; }
      .panel button.primary { background: #f1c40f; color: #111; border-color: #f1c40f; font-weight: bold; }
      .panel .row { display: flex; gap: 8px; align-items: center; }
      .panel .row label { flex: 1; display: flex; gap: 8px; align-items: center; }
      .panel input[type=text] { flex: 1; font: inherit; background: #111; color: #fff; border: 1px solid #555; padding: 7px 8px; min-width: 0; }
      .panel input[type=text]:focus { border-color: #f1c40f; outline: none; }
      .panel .notice { color: #ff9f7f; margin: 0; }
      .panel .confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .panel details summary { cursor: pointer; color: #bbb; }
      .panel table.controls { border-collapse: collapse; margin-top: 6px; font-size: 13px; }
      .panel table.controls td { padding: 2px 10px 2px 0; }
      .panel td.key { color: #f1c40f; white-space: nowrap; }
      .panel .slider { display: grid; grid-template-columns: 130px 1fr 44px; gap: 8px; align-items: center; margin-top: 6px; }
      .panel .check { display: block; margin-top: 8px; }
      #ui { align-items: flex-start; }
      #ui:empty { pointer-events: none; }

    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilstöld</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0c0e12" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, Consolas, monospace; color: #eee; }
      #game { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000; }
      #ui { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
      #ui > * { pointer-events: auto; }
      .panel { background: rgba(12, 14, 18, 0.92); border: 2px solid #f1c40f; padding: 18px 22px; min-width: 320px; max-width: min(520px, 92vw);
        color: #eee; box-shadow: 0 10px 40px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 10px; margin-top: 25vh; }
      [hidden] { display: none !important; }
      .panel .difficulty span { flex: 1; }
      .panel button.choice { padding: 6px 10px; }
      .panel button.choice.active { background: #f1c40f; color: #111; border-color: #f1c40f; }
      .panel h2 { margin: 0 0 4px; color: #f1c40f; font-size: 18px; letter-spacing: 1px; }
      .panel button { font: inherit; background: #23262d; color: #eee; border: 1px solid #555; padding: 8px 12px; cursor: pointer; text-align: left; }
      .panel button:hover, .panel button:focus-visible { border-color: #f1c40f; outline: none; }
      .gamepad .panel :is(button, summary, input):focus { outline: 2px solid #f1c40f; outline-offset: 2px; }
      .panel button.primary { background: #f1c40f; color: #111; border-color: #f1c40f; font-weight: bold; }
      .panel .row { display: flex; gap: 8px; align-items: center; }
      .panel.briefing .portrait { width: 96px; height: 96px; image-rendering: pixelated; border: 2px solid; flex: none; }
      .panel.briefing .who { display: flex; flex-direction: column; gap: 2px; color: #999; font-size: 13px; }
      .panel.briefing p { margin: 0; color: #ddd; line-height: 1.4; }
      .panel.briefing p.job { color: #f1c40f; font-weight: bold; }
      .panel .progress { display: flex; flex-direction: column; gap: 4px; color: #ccc; font-size: 13px; }
      .panel .progress .bar { height: 6px; background: #23262d; border: 1px solid #555; }
      .panel .progress .bar div { height: 100%; background: #f1c40f; }
      .panel .row label { flex: 1; display: flex; gap: 8px; align-items: center; }
      .panel input[type=text] { flex: 1; font: inherit; background: #111; color: #fff; border: 1px solid #555; padding: 7px 8px; min-width: 0; }
      .panel input[type=text]:focus { border-color: #f1c40f; outline: none; }
      .panel .notice { color: #ff9f7f; margin: 0; }
      .panel .confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .panel details summary { cursor: pointer; color: #bbb; }
      .panel table.controls { border-collapse: collapse; margin-top: 6px; font-size: 13px; }
      .panel table.controls td { padding: 2px 10px 2px 0; }
      .panel td.key { color: #f1c40f; white-space: nowrap; }
      .panel td.key .btn { display: inline-block; min-width: 18px; padding: 0 5px; margin-right: 3px; border: 1px solid #777; border-radius: 9px; background: #2b2e35; color: #eee; text-align: center; font-size: 11px; line-height: 16px; font-weight: bold; }
      .panel td.key .btn.face { width: 18px; min-width: 0; padding: 0; border-radius: 50%; color: #111; border: none; }
      .panel td.key .btn.a { background: #5cb85c; } .panel td.key .btn.b { background: #e0574f; }
      .panel td.key .btn.x { background: #4a90d9; } .panel td.key .btn.y { background: #f1c40f; }
      .panel .slider { display: grid; grid-template-columns: 130px 1fr 44px; gap: 8px; align-items: center; margin-top: 6px; }
      .panel .check { display: block; margin-top: 8px; }
      .panel p.hint { margin: 2px 0 0; color: #666; font-size: 11px; font-style: italic; }
      .panel.cheats { max-width: min(640px, 94vw); max-height: 80vh; overflow-y: auto; margin-top: 8vh; gap: 6px; }
      .panel h3 { margin: 6px 0 0; color: #bbb; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
      .panel .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
      .panel .grid button { padding: 6px 8px; font-size: 13px; }
      .panel button:disabled { opacity: .4; cursor: default; }
      .panel .status { margin: 0; color: #f1c40f; min-height: 1.2em; }
      .panel .note { margin: 0; color: #888; font-size: 12px; }
      #ui { align-items: flex-start; }
      #ui:empty { pointer-events: none; }

      body.touch { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #touch, #touch-overlay { position: fixed; inset: 0; touch-action: none; }
      #touch { pointer-events: none; }
      #touch .zone { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; pointer-events: auto; }
      #touch .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.2); }
      #touch .knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(241,196,15,.6); }
      #touch .pad { position: absolute; right: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); gap: 10px; }
      #touch .top { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
      #touch .tb { pointer-events: auto; font: bold 12px ui-monospace, Menlo, Consolas, monospace; color: #fff; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.4); background: rgba(0,0,0,.35); touch-action: none; padding: 0; }
      #touch .tb.down { background: rgba(241,196,15,.6); color: #111; }
      #touch .fire { grid-column: 3; grid-row: 2; border-color: #e74c3c; }
      #touch .enter { grid-column: 3; grid-row: 1; }
      #touch .handbrake { grid-column: 2; grid-row: 2; }
      #touch .brake { grid-column: 1; grid-row: 2; }
      #touch .weapon { grid-column: 2; grid-row: 1; }
      #touch .small { border-radius: 6px; padding: 6px 10px; font-size: 11px; }
      #rotate { display: none; }
      @media (orientation: portrait) {
        body.touch #rotate { display: flex; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
          background: #000; color: #f1c40f; font-size: 20px; text-align: center; padding: 24px; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
